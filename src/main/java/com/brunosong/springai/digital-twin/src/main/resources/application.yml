server:
  port: 8093

spring:
  application:
    name: digital-twin
  ai:
    openai:
      # Gemini 의 OpenAI 호환 엔드포인트. API 키 하나면 되고 GCP 프로젝트 설정이 필요 없다.
      # 키는 application-local.yml(깃 제외)에 두고, bootRun 이 local 프로필을 켜서 덮어쓴다.
      # 그 프로필 없이 띄우면 GEMINI_API_KEY 환경변수가 있어야 한다(없으면 기동 실패).
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com
      chat:
        completions-path: /v1beta/openai/chat/completions
        options:
          model: gemini-3.6-flash
          temperature: 0.7

twin:
  # 세션별 대화 기록 JSON 이 쌓이는 디렉터리
  memory-dir: ./twin-memory
